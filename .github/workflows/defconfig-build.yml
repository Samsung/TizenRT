name: Build Test

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  BOARDS: "qemu rtl8721csm bk7239n rtl8730e"
  DEFAULT_DOCKER_VERSION: "1.5.8"

concurrency:
  group: defconfig-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.configs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare configurations
        id: configs
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re

          boards = os.environ["BOARDS"].split()
          default_docker_version = os.environ["DEFAULT_DOCKER_VERSION"]
          config_root = Path(os.environ["GITHUB_WORKSPACE"]) / "build/configs"
          entries = []

          for board in boards:
              configs = sorted((config_root / board).rglob("defconfig"))
              if not configs:
                  raise ValueError(f"No defconfigs found for {board}")
              for path in configs:
                  config = path.parent.relative_to(config_root).as_posix()
                  if not re.fullmatch(r"[a-z0-9_-]+/[a-zA-Z0-9_-]+", config):
                      raise ValueError(f"Unsupported configuration path: {config}")
                  versions = re.findall(r"^CONFIG_DOCKER_VERSION=(.*)$", path.read_text(), re.M)
                  if len(versions) > 1:
                      raise ValueError(f"Duplicate CONFIG_DOCKER_VERSION: {config}")
                  version = default_docker_version
                  if versions:
                      match = re.fullmatch(r'"([a-zA-Z0-9_][a-zA-Z0-9_.-]*)"', versions[0])
                      if not match:
                          raise ValueError(f"Invalid CONFIG_DOCKER_VERSION: {config}")
                      version = match.group(1)
                  entries.append({
                      "config": config,
                      "id": config.replace("/", "--"),
                      "image": f"tizenrt/tizenrt:{version}",
                      "binary": "tinyara" if board == "qemu" else "tinyara.axf",
                  })

          if len(entries) > 256:
              raise ValueError("GitHub Actions supports at most 256 jobs per matrix")
          if len({entry["id"] for entry in entries}) != len(entries):
              raise ValueError("Artifact names must be unique")

          matrix = {"include": entries}
          payload = json.dumps(matrix, separators=(",", ":"))
          print(payload)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matrix={payload}\n")

  build:
    name: Build ${{ matrix.config }}
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      DEFCONFIG: ${{ matrix.config }}
      BUILD_IMAGE: ${{ matrix.image }}
      BUILD_BINARY: ${{ matrix.binary }}
      BUILD_CONTAINER: defconfig-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure and build binry
        id: compile
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail

          root="${GITHUB_WORKSPACE:?Missing workspace}"
          config="${DEFCONFIG:?Missing configuration}"
          image="${BUILD_IMAGE:?Missing Docker image}"
          binary="${BUILD_BINARY:?Missing expected binary}"
          output="$root/tmp/defconfig-ci"
          mkdir -p "$output"

          git -C "$root" rev-parse HEAD > "$output/source-commit.txt"
          printf '%s\n' "$config" > "$output/configuration.txt"
          printf '%s\n' "$image" > "$output/image.txt"
          cp "$root/build/configs/$config/defconfig" "$output/requested.config"
          docker pull --platform linux/amd64 "$image" 2>&1 | tee "$output/image-pull.log"
          docker image inspect "$image" > "$output/image-inspect.json"
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"

          # Keep the normal dbuild.sh mount for vendor packaging scripts.
          docker run --name "$BUILD_CONTAINER" --pull=never --platform linux/amd64 \
              -v "$root:/root/tizenrt" -w /root/tizenrt/os "$image_id" \
              bash -eo pipefail -c '
                  arm-none-eabi-gcc --version
                  make --version
                  cd tools
                  ./configure.sh "$1"
                  cd ..
                  # Keep compilation, linking and packaging in their serial order.
                  make
                  test -s "../build/output/bin/$2"
              ' -- "$config" "$binary" </dev/null 2>&1 | tee "$output/build.log"
      - name: Collect build evidence
        if: always()
        env:
          BUILD_RESULT: ${{ steps.compile.outcome }}
        shell: bash
        run: |
          set -euo pipefail

          # Stop any remaining build before reading its output files.
          docker rm -f "$BUILD_CONTAINER"

          root="${GITHUB_WORKSPACE:?Missing workspace}"
          output="$root/tmp/defconfig-ci"
          mkdir -p "$output"
          printf '%s\n' "$BUILD_RESULT" > "$output/build-result.txt"
          if [[ -f "$root/os/.config" ]]; then
              cp "$root/os/.config" "$output/effective.config"
          fi
          if [[ -d "$root/build/output/bin" ]]; then
              tar -czf "$output/output.tar.gz" -C "$root/build/output" bin
          fi
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: defconfig-${{ matrix.id }}-${{ github.run_attempt }}
          path: tmp/defconfig-ci/
          retention-days: 7
          if-no-files-found: warn

  result:
    name: Result
    if: always()
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Summarize builds
        uses: actions/github-script@v9
        env:
          BUILD_MATRIX: ${{ needs.prepare.outputs.matrix }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const run_id = context.runId;
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}`;
            const entries = JSON.parse(process.env.BUILD_MATRIX || '{"include":[]}').include;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id, filter: 'all', per_page: 100,
            });
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id, per_page: 100,
            });
            // Keep earlier successful jobs when only failed jobs were re-run.
            const latestJobs = new Map(jobs.filter(job => job.run_attempt <= attempt)
              .sort((a, b) => a.id - b.id).map(job => [job.name, job]));
            const cell = value => String(value).replace(/[|\r\n]/g, ' ');
            const lines = [
              '## Build Test', '',
              `[Run #${context.runNumber}, attempt ${attempt}](${runUrl}/attempts/${attempt})`, '',
              `Prepare: ${process.env.PREPARE_RESULT} · Builds: ${process.env.BUILD_RESULT}`, '',
              '| Configuration | Docker image | Build result | Artifacts |',
              '| --- | --- | --- | --- |',
            ];
            for (const entry of entries) {
              const job = latestJobs.get(`Build ${entry.config}`);
              // Reused jobs get a new run_attempt without producing new artifacts.
              const prefix = `defconfig-${entry.id}-`;
              const started = Date.parse(job?.started_at);
              const completed = Date.parse(job?.completed_at);
              const artifact = artifacts.find(item => {
                const suffix = item.name.startsWith(prefix) ? item.name.slice(prefix.length) : '';
                const created = Date.parse(item.created_at);
                return /^[1-9]\d*$/.test(suffix) && Number(suffix) <= attempt &&
                  !item.expired && created >= started && created <= completed;
              });
              const result = job?.conclusion || 'unavailable';
              const status = job ? `[${result}](${job.html_url})` : result;
              const download = artifact ? `[Download](${runUrl}/artifacts/${artifact.id})` : 'Unavailable';
              lines.push(`| ${cell(entry.config)} | ${cell(entry.image)} | ${status} | ${download} |`);
            }
            const report = lines.join('\n') + '\n';
            const directory = path.join(process.env.RUNNER_TEMP, 'build-test-report');
            fs.mkdirSync(directory, {recursive: true});
            fs.writeFileSync(path.join(directory, 'report.md'), report);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report);
      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-test-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-test-report/report.md
          retention-days: 7
          if-no-files-found: error
      - name: Require every build to succeed
        if: always()
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$BUILD_RESULT" = success
